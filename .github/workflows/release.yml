name: Release

# Trigger by pushing a version tag, e.g.:
#   npm version patch --no-git-tag-version
#   git commit -am "v1.2.3" && git push
#   git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write      # create the GitHub Release + upload assets
      packages: write      # publish to GitHub Packages
      id-token: write      # sign the build-provenance attestation (Sigstore OIDC)
      attestations: write  # store the attestation on the repo
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        # Fails in seconds on a parse error instead of after a ~2 min build,
        # and stops a broken tag from ever publishing.
        run: npm run check

      - name: Ensure release exists (avoids electron-builder create race)
        # electron-builder uploads multiple artifacts in parallel; each one
        # does check-then-create on the release, which can race and 422 with
        # "already_exists". Pre-creating the release means every uploader
        # finds it already there and just uploads.
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "${{ github.repository }}" --title $tag --notes "Release $tag"
          }

      - name: Build and publish to GitHub Releases
        # electron-builder reads the "publish" config in package.json,
        # creates the release for this tag, and uploads the installer,
        # portable exe, latest.yml and blockmaps (latest.yml is what
        # makes auto-update work).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always

      - name: Label release assets (Installer / Portable)
        # electron-builder uploads assets without display labels; add the
        # "(Installer)" / "(Portable)" suffixes shown on the Releases page.
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"
          $tag  = "${{ github.ref_name }}"
          $assets = gh api "repos/$repo/releases/tags/$tag" --jq '.assets' | ConvertFrom-Json
          foreach ($a in $assets) {
            if ($a.name -like "*.blockmap" -or $a.name -eq "latest.yml") { continue }
            if ($a.name -like "*Setup*.exe") {
              gh api -X PATCH "repos/$repo/releases/assets/$($a.id)" -f label="$($a.name) (Installer)"
            } elseif ($a.name -like "*.exe") {
              gh api -X PATCH "repos/$repo/releases/assets/$($a.id)" -f label="$($a.name) (Portable)"
            }
          }

      - name: Publish SHA-256 checksums
        # Hash the exes CI built, refuse to publish if the release copies differ
        # (GitHub reports each asset's sha256 digest), then attach
        # SHA256SUMS.txt and put the same table in the release notes.
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"
          $tag  = "${{ github.ref_name }}"
          # electron-builder writes "qBittorrent Desktop Setup X.exe" locally and
          # uploads it as "qBittorrent-Desktop-Setup-X.exe"; users get the latter.
          $files = @(Get-ChildItem dist -Filter '*.exe' | Sort-Object Name)
          if ($files.Count -ne 2) { throw "Expected 2 exes in dist, found $($files.Count): $($files.Name -join ', ')" }
          $assets = gh api "repos/$repo/releases/tags/$tag" --jq '.assets' | ConvertFrom-Json
          $lines = foreach ($f in $files) {
            $published = $f.Name -replace ' ', '-'
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            $asset = $assets | Where-Object { $_.name -eq $published }
            if (-not $asset) { throw "$published is not on the release" }
            if ($asset.digest -ne "sha256:$hash") { throw "${published}: release copy $($asset.digest) != built sha256:$hash" }
            "$hash  $published"
          }
          # LF line endings: Set-Content would write CRLF on this Windows runner,
          # and `sha256sum -c` (Linux/macOS) then can't find the files.
          [IO.File]::WriteAllText("$PWD/SHA256SUMS.txt", (($lines -join "`n") + "`n"))
          gh release upload $tag SHA256SUMS.txt --clobber --repo $repo
          $table = ($lines | ForEach-Object { $h, $n = $_ -split '  ', 2; "| ``$n`` | ``$h`` |" }) -join "`n"
          $notes = @"
          ### Verify your download
          Built by [this workflow run](${{ github.server_url }}/$repo/actions/runs/${{ github.run_id }}) from tag ``$tag``. See the [README](${{ github.server_url }}/$repo#verify-your-download) for how to check these.

          | File | SHA-256 |
          |---|---|
          $table

          Build provenance: ``gh attestation verify <file>.exe --repo $repo``
          "@
          gh release edit $tag --repo $repo --notes $notes

      - name: Attest build provenance
        # Signed statement that these exact exes were built by this workflow,
        # from this repo, at this commit. Runs after the checksum step, which
        # has already asserted dist holds exactly the two published exes.
        # Users check it with:
        #   gh attestation verify <file>.exe --repo GeorgeAL78/qbittorrent-desktop
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.exe

      # Configure auth for GitHub Packages only now, so the scoped
      # registry can't interfere with the public-registry npm ci above.
      - name: Set up Node.js for GitHub Packages
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@georgeal78'

      - name: Publish to GitHub Packages
        # Best-effort: a packages failure shouldn't fail the release.
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish
